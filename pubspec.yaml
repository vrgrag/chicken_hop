name: chicken_hop
description: "Chicken Hop - Swap and Hop puzzle"
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / storage
  shared_preferences: ^2.3.3

  # Networking + device meta
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.1

  # External shell
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0
  url_launcher: ^6.3.1

  # Firebase + push
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  firebase_app_check: ^0.3.2+1
  flutter_local_notifications: ^18.0.1

  # NOTE: do NOT upgrade to >=10.x. 10+ is Kotlin-only and brings its
  # own KGP that clashes with Flutter's built-in Kotlin support, breaking
  # GeneratedPluginRegistrant. 8.1.4 is the last safe Java-based release.
  file_picker: 8.1.4

  # Attribution
  appsflyer_sdk: ^6.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFD27A"
  adaptive_icon_foreground: "assets/icon2.png"
  adaptive_icon_foreground_inset: 0
